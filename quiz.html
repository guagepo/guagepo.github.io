<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Speci⁺ 人擇空間｜觀展測驗</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- 測驗 CSS -->
    <link rel="stylesheet" href="css/quiz.css">
</head>

<body>

    <main id="quiz-app">

        <!-- 開場畫面 -->
        <section id="intro-screen" class="quiz-screen active">

            <a
                href="index.html"
                class="close-button"
                aria-label="返回展覽首頁"
            >
                ×
            </a>

            <div class="intro-decoration decoration-one"></div>
            <div class="intro-decoration decoration-two"></div>

            <div class="intro-content">

                <p class="eyebrow">
                    SPECI⁺ SELECTION SYSTEM
                </p>

                <h1>
                    你的選擇，<br>
                    會帶你走向哪一種觀看方式？
                </h1>

                <p class="intro-description">
                    回答五個問題，探索你在資訊、創作與展覽之中的選擇傾向。
                </p>
                

                <button
                    id="start-button"
                    class="main-button"
                    type="button"
                >
                    開始探索
                    <span>↗</span>
                </button>

            </div>

            <p class="intro-number">00 / 05</p>

        </section>


        <!-- 題目畫面 -->
        <section id="question-screen" class="quiz-screen">

            <header class="quiz-header">

                <a href="index.html" class="quiz-brand">
                    SPECI⁺ 人擇空間
                </a>

                <button
                    id="exit-button"
                    class="exit-button"
                    type="button"
                >
                    離開測驗
                </button>

            </header>

            <div class="question-container">

                <div class="progress-area">

                    <p id="question-number">
                        QUESTION 01 / 05
                    </p>

                    <div class="progress-track">
                        <div id="progress-bar"></div>
                    </div>

                </div>

                <div id="question-content" class="question-content">

                    <h2 id="question-text"></h2>

                    <div id="answer-list" class="answer-list"></div>

                </div>

            </div>

        </section>


        <!-- 分析畫面 -->
        <section id="loading-screen" class="quiz-screen">

            <div class="loading-content">

                <p class="eyebrow">
                    SPECI⁺ SELECTION SYSTEM
                </p>

                <h2>
                    正在分析<br>
                    你的選擇
                </h2>

                <div class="loading-symbol" aria-hidden="true">

                    <div class="loading-circle circle-one"></div>
                    <div class="loading-circle circle-two"></div>
                    <div class="loading-circle circle-three"></div>

                </div>

                <p class="loading-text">
                    ANALYZING YOUR SELECTION...
                </p>

            </div>

        </section>


        <!-- 結果畫面 -->
        <section id="result-screen" class="quiz-screen">

            <header class="quiz-header">

                <a href="index.html" class="quiz-brand">
                    SPECI⁺ 人擇空間
                </a>

                <button
                    id="restart-top-button"
                    class="exit-button"
                    type="button"
                >
                    重新測驗
                </button>

            </header>

            <div class="result-container">

                <div class="result-title-area">

                    <p class="eyebrow">
                        YOUR SELECTION TYPE IS
                    </p>

                    <h2 id="result-name"></h2>

                    <p id="result-english" class="result-english"></p>

                </div>

                <div class="result-image-wrapper">

                    <img
                        id="result-image"
                        src=""
                        alt="Speci+ 人擇空間測驗結果"
                    >

                </div>

                <div class="result-information">

                    <p id="result-summary"></p>

                    <div class="result-buttons">

                        <a
                            href="index.html#works"
                            class="main-button"
                        >
                            前往成果展示
                            <span>↘</span>
                        </a>

                        <button
                            id="restart-button"
                            class="secondary-button"
                            type="button"
                        >
                            再測一次
                        </button>

                    </div>

                </div>

            </div>

        </section>

    </main>

    <script src="js/quiz.js"></script>

</body>
</html>
